<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        body{
            font-family:Arial;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:#1e293b;
            padding:40px;
            border-radius:10px;
            width:350px;
        }

        h1{
            text-align:center;
            color:white;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:5px;
            background:orange;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        p{
            color:red;
            text-align:center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username">

            <input type="password"
                   name="password"
                   placeholder="Password">

            <button type="submit">
                Login
            </button>

        </form>

        <p>{{ error }}</p>

    </div>

</body>
</html>
