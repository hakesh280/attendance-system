<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>

        body{
            font-family:Arial;
            background:#1e293b;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:#334155;
            padding:40px;
            border-radius:10px;
            width:400px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:5px;
            background:orange;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Add Student</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="name" placeholder="Student Name">

            <input type="text" name="usn" placeholder="USN">

            <input type="text" name="department" placeholder="Department">

            <input type="number" name="semester" placeholder="Semester">

            <button type="submit">Save Student</button>

        </form>

    </div>

</body>
</html>
