{% extends 'base.html' %}

{% block title %}Edit Attendance - Attendance System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-pen"></i> Edit Attendance</h1>
        <a href="{% url 'attendance_report' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Report
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">{{ attendance.student.name }} - {{ attendance.date }} - {{ attendance.period }}</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" value="{{ attendance.subject.subject_name }}" disabled>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Present" {% if attendance.status == 'Present' %}selected{% endif %}>Present</option>
                            <option value="Absent" {% if attendance.status == 'Absent' %}selected{% endif %}>Absent</option>
                        </select>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="opinion" class="form-label">Admin Opinion</label>
                        <textarea class="form-control" id="opinion" name="opinion" rows="4" required>{{ attendance.change_opinion }}</textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning">
                    <i class="fas fa-save"></i> Save Change
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
