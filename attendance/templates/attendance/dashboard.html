<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#0f172a;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        .card{
            background:#1e293b;
            padding:30px;
            border-radius:10px;
            text-align:center;
        }

        .card h2{
            font-size:40px;
            color:orange;
            margin-bottom:10px;
        }

        .card p{
            font-size:20px;
        }

    </style>

</head>

<body>

    <h1>📊 Attendance Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>{{ total_students }}</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2>{{ total_attendance }}</h2>
            <p>Total Attendance Records</p>
        </div>

        <div class="card">
            <h2>{{ present_count }}</h2>
            <p>Total Present</p>
        </div>

<div class="card">
    <h2>{{ absent_count }}</h2>
    <p>Total Absent</p>
</div>

    </div>
    <div style="width:400px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;">

    <canvas id="attendanceChart"></canvas>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

    const ctx = document.getElementById('attendanceChart');

    new Chart(ctx, {

        type: 'pie',

        data: {

            labels: ['Present', 'Absent'],

            datasets: [{

                data: [
                    {{ present_count }},
                    {{ absent_count }}
                ],

                backgroundColor: [
                    'green',
                    'red'
                ]

            }]

        }

    });

</script>
</body>
</html>
