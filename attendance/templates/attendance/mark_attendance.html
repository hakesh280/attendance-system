<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>

    <style>

        body{
            font-family:Arial;
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:#1e293b;
            padding:40px;
            border-radius:10px;
            width:400px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        select,input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            border-radius:5px;
            background:orange;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Mark Attendance</h1>

        <form method="POST">

            {% csrf_token %}

            <select name="student">

                {% for student in students %}

                    <option value="{{ student.id }}">
                        {{ student.name }}
                    </option>

                {% endfor %}

            </select>

            <input type="date" name="date">

            <select name="status">

                <option value="Present">Present</option>

                <option value="Absent">Absent</option>

            </select>

            <button type="submit">Save Attendance</button>

        </form>

    </div>

</body>
</html>
