<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>

    <style>

        body{
            font-family:Arial;
            background:#0f172a;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#1e293b;
        }

        th,td{
            padding:15px;
            border:1px solid #334155;
            text-align:center;
        }

        th{
            background:orange;
        }

    </style>

</head>

<body>

    <h1>Attendance Report</h1>
    <div class="container mt-4">

<form method="GET">

    <div class="row">

        <div class="col-md-4">

            <input
                type="date"
                name="date"
                class="form-control">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-primary">

                Search

            </button>

        </div>

    </div>

</form>

</div>

<br>

    <table>

        <tr>
            <th>Student Name</th>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for attendance in attendance_data %}

        <tr>

            <td>{{ attendance.student.name }}</td>

            <td>{{ attendance.date }}</td>

            <td>{{ attendance.status }}</td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
