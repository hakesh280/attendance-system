<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <style>

        body{
            font-family:Arial;
            background:#0f172a;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:#1e293b;
        }

        th,td{
            padding:15px;
            border:1px solid #334155;
            text-align:center;
        }

        th{
            background:orange;
        }

        a{
            text-decoration:none;
            color:white;
            background:red;
            padding:8px 15px;
            border-radius:5px;
        }

    </style>

</head>

<body>

    <h1>Student List</h1>
    <form method="GET" style="margin-bottom:20px;">

    <input type="text"
           name="q"
           placeholder="Search Student"
           style="padding:10px;
                  width:300px;
                  border:none;
                  border-radius:5px;">

    <button type="submit"
            style="padding:10px 20px;
                   background:orange;
                   border:none;
                   color:white;
                   border-radius:5px;">

        Search

    </button>

</form>

    <table>

        <tr>
            <th>Name</th>
            <th>USN</th>
            <th>Department</th>
            <th>Semester</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.name }}</td>

            <td>{{ student.usn }}</td>

            <td>{{ student.department }}</td>

            <td>{{ student.semester }}</td>

           <td>

    <a href="/edit-student/{{ student.id }}"
       style="background:orange;">
        Edit
    </a>

    <a href="/delete-student/{{ student.id }}">
        Delete
    </a>

</td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
