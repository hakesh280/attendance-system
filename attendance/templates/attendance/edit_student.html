{% extends 'base.html' %}

{% block title %}Edit Student - Attendance System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="fas fa-user-pen"></i> Edit Student</h1>
        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Students
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-id-card"></i> Student Details</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Student Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="roll_number" class="form-label">Roll Number / USN</label>
                        <input type="text" class="form-control" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Department / Class</label>
                        <input type="text" class="form-control" id="department" name="department" value="{{ student.department }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="semester" class="form-label">Semester</label>
                        <input type="number" min="1" max="8" class="form-control" id="semester" name="semester" value="{{ student.semester }}" required>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update Student
                    </button>
                    <a href="{% url 'change_student_password' student.id %}" class="btn btn-warning">
                        <i class="fas fa-key"></i> Change Password
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
